# 포스팅 PR 검사 (plan M6.2). Secret 없음, 읽기 전용 토큰.
# 검사 스크립트는 PR이 아니라 base 커밋에서 가져오므로, PR에서 스크립트를 고쳐 검사를 우회할 수 없다.
name: post-check

on:
  pull_request:
    paths:
      - "posts/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted checker (base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      # 기본 ref는 PR 머지 커밋이다. HEAD^1(base)과 비교하려고 depth 2로 받는다.
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check post paths and front matter
        env:
          POST_BRANCH: ${{ github.head_ref }}  # 브랜치 이름은 env로만 넘긴다 (run: 보간 금지)
        run: python -I trusted/scripts/check_post.py pr
