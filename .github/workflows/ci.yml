# 사이트 빌드·포스팅 검사 스크립트의 테스트. Secret 없음, 읽기 전용 토큰.
# 포스팅(posts/)만 바뀌는 PR에는 돌지 않는다 (그건 post-check가 맡는다).
name: ci

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install "pytest==8.3.5"

      - name: Script tests
        run: python -m pytest scripts -q -p no:cacheprovider
